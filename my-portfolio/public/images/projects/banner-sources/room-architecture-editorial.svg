<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Room system architecture</title><desc id="desc">Claude Code or Codex connects to a per-session Room MCP process containing a file publisher, parser and graph, coordination services and a Yjs replica per joined room. It synchronizes via a local daemon or an optional team server with other agent sessions. Local files and explicitly requested worker worktrees remain separate; browser views are read-only and collection is explicit.</desc><rect width="1600" height="1000" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#244f3e" stroke-width="1.2"/></marker><marker id="back" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1L2 4L7 7" fill="none" stroke="#244f3e" stroke-width="1.2"/></marker></defs><g font-family="Arial, sans-serif"><text x="64" y="63" font-size="16" fill="#62655e" letter-spacing="2">PROJECT NOTES / AGENT COORDINATION</text><text x="1536" y="63" font-size="16" fill="#62655e" text-anchor="end" letter-spacing="2">SYSTEM ARCHITECTURE</text><path d="M64 86H1536" stroke="#dcd5c8"/><text x="60" y="177" font-size="100" fill="#244f3e" font-weight="600" letter-spacing="-5">Room</text><text x="405" y="142" font-size="37" fill="#272b28" letter-spacing="-1">Local execution. Shared coordination.</text><text x="408" y="184" font-size="24" fill="#62655e" >Components, connections and the boundary around your files.</text><text x="64" y="254" font-size="16" fill="#8a6049" letter-spacing="1.7">HOST &amp; WORKSPACE</text><text x="470" y="254" font-size="16" fill="#8a6049" letter-spacing="1.7">PER-SESSION ROOM PROCESS</text><text x="1130" y="254" font-size="16" fill="#8a6049" letter-spacing="1.7">ROOM CONNECTIONS</text><rect x="64" y="292" width="320" height="116" fill="#f7f5ef" stroke="#dcd5c8" stroke-width="1.5" rx="5" /><text x="86" y="327" font-size="24" fill="#244f3e" font-weight="600" letter-spacing="-.5">Claude Code / Codex</text><text x="86" y="359" font-size="18" fill="#62655e" >Plugin skills + hooks</text><text x="86" y="385" font-size="18" fill="#62655e" >Model execution + permissions</text><rect x="64" y="477" width="320" height="116" fill="#f7f5ef" stroke="#dcd5c8" stroke-width="1.5" rx="5" /><text x="86" y="512" font-size="24" fill="#244f3e" font-weight="600" letter-spacing="-.5">Own Git checkout</text><text x="86" y="544" font-size="18" fill="#62655e" >HEAD, index and working files</text><text x="86" y="570" font-size="18" fill="#62655e" >Edits stay in this checkout</text><rect x="64" y="690" width="320" height="144" fill="#f7f5ef" stroke="#dcd5c8" stroke-width="1.5" rx="5" stroke-dasharray="5 5"/><text x="86" y="725" font-size="24" fill="#244f3e" font-weight="600" letter-spacing="-.5">Optional Room workers</text><text x="86" y="757" font-size="18" fill="#62655e" >Separate host sessions</text><text x="86" y="783" font-size="18" fill="#62655e" >Isolated Git worktrees</text><text x="86" y="809" font-size="18" fill="#62655e" >Only on explicit request</text><rect x="470" y="292" width="590" height="542" fill="#edf0e8" stroke="#dcd5c8" stroke-width="1.5" rx="5" /><text x="492" y="330" font-size="31" fill="#244f3e" font-weight="600" letter-spacing="-1">room-mcp</text><text x="492" y="359" font-size="19" fill="#62655e" >Tools · host binding · policy · workers · bridge</text><rect x="492" y="400" width="258" height="116" fill="#f7f5ef" stroke="#dcd5c8" stroke-width="1.5" rx="5" /><text x="514" y="435" font-size="23" fill="#244f3e" font-weight="600" letter-spacing="-.5">roomd publisher</text><text x="514" y="467" font-size="18" fill="#62655e" >Reads eligible Git changes</text><text x="514" y="493" font-size="18" fill="#62655e" >Applies sharing policy</text><rect x="778" y="400" width="260" height="116" fill="#f7f5ef" stroke="#dcd5c8" stroke-width="1.5" rx="5" /><text x="800" y="435" font-size="23" fill="#244f3e" font-weight="600" letter-spacing="-.5">Parser + graph</text><text x="800" y="467" font-size="18" fill="#62655e" >Tree-sitter definitions</text><text x="800" y="493" font-size="18" fill="#62655e" >References + consumers</text><rect x="492" y="565" width="546" height="93" fill="#f7f5ef" stroke="#dcd5c8" stroke-width="1.5" rx="5" /><text x="514" y="600" font-size="24" fill="#244f3e" font-weight="600" letter-spacing="-.5">Coordination services</text><text x="514" y="632" font-size="18" fill="#62655e" >Conflict checks · scopes / claims · delivery ledger</text><rect x="492" y="701" width="546" height="108" fill="#f7f5ef" stroke="#dcd5c8" stroke-width="1.5" rx="5" /><text x="514" y="736" font-size="24" fill="#244f3e" font-weight="600" letter-spacing="-.5">Yjs replica per room</text><text x="514" y="768" font-size="18" fill="#62655e" >Participants · plans · manifests / overlays</text><text x="514" y="794" font-size="18" fill="#62655e" >Graphs · workers · message bus / ledger</text><rect x="1130" y="292" width="406" height="150" fill="#edf0e8" stroke="#dcd5c8" stroke-width="1.5" rx="5" /><text x="1152" y="327" font-size="24" fill="#244f3e" font-weight="600" letter-spacing="-.5">Local daemon / relay</text><text x="1152" y="359" font-size="18" fill="#62655e" >Loopback only · one per clone</text><text x="1152" y="385" font-size="18" fill="#62655e" >hub-core: leases, ordered posts, expiry</text><text x="1152" y="411" font-size="18" fill="#62655e" >File snapshots + discovery</text><rect x="1130" y="492" width="406" height="174" fill="#f7f5ef" stroke="#dcd5c8" stroke-width="1.5" rx="5" /><text x="1152" y="527" font-size="24" fill="#244f3e" font-weight="600" letter-spacing="-.5">Optional team server</text><text x="1152" y="559" font-size="18" fill="#62655e" >Self-hosted · auth + repo admission</text><text x="1152" y="585" font-size="18" fill="#62655e" >hub-core + replicated room state</text><text x="1152" y="611" font-size="18" fill="#62655e" >LevelDB + files with YPERSISTENCE</text><text x="1152" y="637" font-size="18" fill="#62655e" >Without persistence: memory only</text><rect x="1130" y="724" width="406" height="110" fill="#f7f5ef" stroke="#dcd5c8" stroke-width="1.5" rx="5" /><text x="1152" y="759" font-size="24" fill="#244f3e" font-weight="600" letter-spacing="-.5">Other agent sessions</text><text x="1152" y="791" font-size="18" fill="#62655e" >Their own hosts, plugins and files</text><text x="1152" y="817" font-size="18" fill="#62655e" >Connect to the same selected room</text><path d="M384 350H470" fill="none" stroke="#244f3e" stroke-width="1.7" marker-end="url(#arrow)" marker-start="url(#back)" /><text x="427" y="336" font-size="14" fill="#62655e" text-anchor="middle">MCP</text><path d="M384 510H448V458H492" fill="none" stroke="#244f3e" stroke-width="1.7" marker-end="url(#arrow)"  /><text x="437" y="545" font-size="14" fill="#62655e" text-anchor="middle">read</text><path d="M750 458H778" fill="none" stroke="#244f3e" stroke-width="1.7" marker-end="url(#arrow)"  /><path d="M621 516V565" fill="none" stroke="#244f3e" stroke-width="1.7" marker-end="url(#arrow)"  /><path d="M908 516V565" fill="none" stroke="#244f3e" stroke-width="1.7" marker-end="url(#arrow)"  /><path d="M765 658V701" fill="none" stroke="#244f3e" stroke-width="1.7" marker-end="url(#arrow)" marker-start="url(#back)" /><path d="M384 761H470" fill="none" stroke="#244f3e" stroke-width="1.7" marker-end="url(#arrow)" marker-start="url(#back)" stroke-dasharray="5 5"/><text x="427" y="743" font-size="13" fill="#62655e" text-anchor="middle">manage</text><path d="M1060 371H1130" fill="none" stroke="#244f3e" stroke-width="1.7" marker-end="url(#arrow)" marker-start="url(#back)" /><text x="1095" y="352" font-size="14" fill="#62655e" text-anchor="middle">local</text><path d="M1060 582H1130" fill="none" stroke="#244f3e" stroke-width="1.7" marker-end="url(#arrow)" marker-start="url(#back)" /><text x="1095" y="563" font-size="14" fill="#62655e" text-anchor="middle">team</text><path d="M1536 367H1560V700H1290V724" fill="none" stroke="#244f3e" stroke-width="1.7" marker-end="url(#arrow)" marker-start="url(#back)" /><path d="M1333 666V724" fill="none" stroke="#244f3e" stroke-width="1.7" marker-end="url(#arrow)" marker-start="url(#back)" /><text x="1351" y="689" font-size="14" fill="#62655e" >sync</text><path d="M64 870H1536" stroke="#dcd5c8"/><text x="64" y="907" font-size="15" fill="#8a6049" letter-spacing="1.6">READ-ONLY VIEW</text><text x="64" y="939" font-size="22" fill="#272b28" >Browser → selected room</text><text x="64" y="967" font-size="17" fill="#62655e" >Local file viewer or hosted web view.</text><text x="600" y="907" font-size="15" fill="#8a6049" letter-spacing="1.6">PRIVATE LOCAL STATE</text><text x="600" y="939" font-size="22" fill="#272b28" >Registry, receipts, logs + recovery</text><text x="600" y="967" font-size="17" fill="#62655e" >Stored under the clone’s Git common directory.</text><text x="1130" y="907" font-size="15" fill="#8a6049" letter-spacing="1.6">EXPLICIT INTEGRATION</text><text x="1130" y="939" font-size="22" fill="#272b28" >Preview → review → collect</text><text x="1130" y="967" font-size="17" fill="#62655e" >Shared edits never auto-apply to disk.</text></g></svg>